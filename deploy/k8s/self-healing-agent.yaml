apiVersion: v1
kind: Namespace
metadata:
  name: demo-payments-service
---
apiVersion: v1
kind: Namespace
metadata:
  name: self-healing-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing-agent-sa
  namespace: self-healing-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: self-healing-agent-role
rules:
  # Allow watching and managing target deployments and pods in demo namespaces
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/rollback", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: self-healing-agent-rb
subjects:
  - kind: ServiceAccount
    name: self-healing-agent-sa
    namespace: self-healing-system
roleRef:
  kind: ClusterRole
  name: self-healing-agent-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-agent
  namespace: self-healing-system
  labels:
    app: self-healing-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healing-agent
  template:
    metadata:
      labels:
        app: self-healing-agent
    spec:
      serviceAccountName: self-healing-agent-sa
      containers:
        - name: agent
          image: self-healing-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: TARGET_MODE
              value: "K8S"
            - name: LLM_PROVIDER
              value: "gemini"
            - name: LLM_MODEL
              value: "gemini-3-flash-preview"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: api-key
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing-dashboard
  namespace: self-healing-system
spec:
  type: NodePort
  selector:
    app: self-healing-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
